<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pack opening · transparent preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191626;color:#fff9e9;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;padding:20px}main{width:min(100%,520px)}h1{font-size:22px;margin:0 0 4px}p{color:#d5c5e6;margin:0 0 12px;font-size:14px}.stage{position:relative;display:grid;place-items:center;height:min(60dvh,560px);overflow:hidden;border:3px solid #0f0c1a;border-radius:3px;background:#29243b}.stage:not(.checker){background:radial-gradient(ellipse at 50% 48%,#654274,#33273f 65%,#211c31)}.stage:not(.checker)::before{content:"";position:absolute;inset:0;background:url("/farm_td/assets/ui/textures/seed-sprout-pattern.svg") 20px 28px/160px 160px;filter:invert(1);mix-blend-mode:screen;opacity:.075}.stage.checker{background-color:#776784;background-image:linear-gradient(45deg,#a698b0 25%,transparent 25%),linear-gradient(-45deg,#a698b0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#a698b0 75%),linear-gradient(-45deg,transparent 75%,#a698b0 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}video{position:absolute;inset:0;height:100%;width:100%;object-fit:contain}.flash{position:absolute;inset:0;background:#fff9e9;opacity:0;pointer-events:none}.flash.on{animation:burst .46s ease-out}@keyframes burst{0%{opacity:0}15%{opacity:1}30%{opacity:1}100%{opacity:0}}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{min-height:44px;padding:8px 14px;border:2px solid #0f0c1a;border-radius:2px;background:#b486d9;color:#191626;font:700 14px system-ui;cursor:pointer}button.primary{background:#ffcb46}label{display:flex;align-items:center;gap:6px;font-size:14px}input{width:18px;height:18px}[type=range]{width:100%;height:24px;margin:8px 0 0;accent-color:#ffcb46}.status{font-size:13px;color:#c5b9d8;margin:8px 0 0}a{color:#ffcb46}video:focus-visible,button:focus-visible{outline:3px solid #ffcb46;outline-offset:3px}
</style></head>
<body><main><h1>Pack opening</h1><p>Latest green-screen clip: lightning build-up, transparent backdrop, original sprout colors, and white opening burst. Playback is 1.3× with an extra UI flash.</p><div class="stage" id="stage"><video id="clip" src="/farm_td/assets/ui/fruit-quest/pack-open-20261005-alpha.webm" muted playsinline preload="auto" aria-label="Pack opening animation"></video><div class="flash" id="flash"></div></div><div class="controls"><button class="primary" id="play">Play / replay</button><button id="pause">Pause</button><button id="background" aria-pressed="false">Checkerboard</button><label><input id="use-flash" type="checkbox" checked>Extra UI flash</label></div><input type="range" id="seek" min="0" max="5.07" step="0.01" value="0" aria-label="Animation position in seconds"><p class="status" id="status">Loading…</p></main>
<script>
const clip=document.getElementById('clip'),flash=document.getElementById('flash'),status=document.getElementById('status');let flashed=false;clip.playbackRate=1.3;
const update=()=>{document.getElementById("seek").value=clip.currentTime;clip.style.opacity=document.getElementById("use-flash").checked&&clip.currentTime>=4.25?0:1;status.textContent=`${clip.currentTime.toFixed(2)} / ${(clip.duration||0).toFixed(2)} seconds · 1.3×`;if(clip.currentTime>=4.05&&!flashed){flashed=true;if(document.getElementById('use-flash').checked){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}};
document.getElementById('seek').oninput=e=>{clip.pause();clip.currentTime=Number(e.target.value);flashed=true;flash.classList.remove('on')};clip.addEventListener('loadedmetadata',update);clip.addEventListener('timeupdate',update);clip.addEventListener('error',()=>status.textContent='This browser could not play the export.');
document.getElementById('play').onclick=async()=>{clip.currentTime=0;clip.style.opacity=1;flashed=false;flash.classList.remove('on');await clip.play()};document.getElementById('pause').onclick=()=>clip.pause();document.getElementById('background').onclick=e=>{const on=document.getElementById('stage').classList.toggle('checker');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'Game background':'Checkerboard'};
</script></body></html>
