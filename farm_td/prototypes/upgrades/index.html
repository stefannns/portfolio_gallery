<!doctype html>
<html lang="en" class="theme-sharp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Upgrade choices · Farm TD</title>
    <link rel="stylesheet" href="/farm_td/assets/ui/fruit-quest/styles.css" />
    <link rel="stylesheet" href="/farm_td/assets/ui/fruit-quest/sharp-theme.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" />
    <script type="module" crossorigin src="/farm_td/assets/upgrades-D4CGwVJ-.js"></script>
    <link rel="modulepreload" crossorigin href="/farm_td/assets/typography-Bv92xBIB.js">
    <link rel="modulepreload" crossorigin href="/farm_td/assets/upgradeCard-BbzT1zK7.js">
    <link rel="stylesheet" crossorigin href="/farm_td/assets/typography-DeqjSeVP.css">
    <link rel="stylesheet" crossorigin href="/farm_td/assets/upgrades-BF9yHlPh.css">
    <link rel="stylesheet" crossorigin href="/farm_td/assets/augments-NbyL4k-B.css">
  </head>
  <body data-screen="battle">
    <header class="preview-toolbar">
      <h1>Upgrade choices</h1>
      <label class="upgrade-preview-picker">Seed <select id="seed-picker"></select></label>
      <fieldset class="style-picker upgrade-style-picker">
        <legend>Frame design</legend>
        <label><input type="radio" name="frame" value="harvest-tag" />A · Harvest tag</label>
        <label><input type="radio" name="frame" value="orchard-sign" />B · Orchard sign</label>
        <label><input type="radio" name="frame" value="leaf-folio" />C · Leaf folio</label>
        <label><input type="radio" name="frame" value="current" />Current packet</label>
      </fieldset>
      <div class="preview-controls"><button id="compare" type="button">Compare A / B / C</button></div>
      <p class="preview-hint">Tier 1: Base → Tier 2: +20% health and damage (4 seeds) → Tier 3: Branch (12 seeds) → Tier 4: Mastery (24 seeds)</p>
    </header>
    <div id="shell">
      <div class="app-shell augment-preview-stage augment-live-stage upgrade-candidate-stage">
        <main class="combat-draft combat-augment-draft combat-upgrade-draft" aria-label="Upgrade preview">
          <section class="combat-choice-panel">
            <span class="combat-choice-kicker" id="price"></span>
            <h2 id="upgrade-title"></h2>
            <div class="combat-choice-cards" id="upgrade-cards"></div>
            <p class="upgrade-choice-note">Tier 3 · Keeps your Tier 2 bonus. Applies to future fighters.</p>
            <a class="combat-choice-close upgrade-preview-back" href="/farm_td/#preview">Back to game</a>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
