<style>
  :root { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18181b; background: #f7f7f8; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, input { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #6d5efc; outline-offset: 3px; }
  .shell { max-width: 1530px; margin: 0 auto; padding: 30px clamp(16px, 3vw, 44px) 42px; }
  .eyebrow { color: #67677a; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 25px; }
  h1 { margin: 7px 0 6px; font-size: clamp(29px, 3vw, 45px); line-height: 1.08; letter-spacing: -.045em; }
  .lede { margin: 0; color: #666779; line-height: 1.5; }
  .count { flex: none; background: #24232b; color: white; border-radius: 999px; padding: 10px 15px; font-size: 13px; font-weight: 750; }
  .layout { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(360px, 510px); gap: 22px; align-items: start; }
  .panel { background: white; border: 1px solid #e5e5ea; border-radius: 20px; box-shadow: 0 11px 35px #24232b0a; }
  .library { min-height: 650px; overflow: hidden; }
  .toolbar { position: sticky; top: 0; z-index: 2; background: white; padding: 18px; border-bottom: 1px solid #ededf0; }
  .search { width: 100%; min-height: 46px; padding: 0 15px; border: 1px solid #d9d9e1; border-radius: 11px; color: #18181b; background: #fbfbfc; font-size: 15px; }
  .results { padding: 4px 18px 17px; max-height: calc(100vh - 240px); min-height: 460px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 11px; align-items: center; width: 100%; min-height: 67px; margin-bottom: 7px; padding: 10px 12px; border: 1px solid #e9e9ee; border-radius: 12px; background: white; text-align: left; cursor: pointer; transition: border-color .18s, background .18s, transform .18s; }
  .row:hover { transform: translateY(-1px); border-color: #bfc0d0; background: #fafaff; }
  .row.active { border-color: #6d5efc; background: #f5f3ff; }
  .number { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 10px; background: #eeeeF2; color: #505164; font-size: 12px; font-weight: 800; }
  .row.active .number { background: #ded9ff; color: #4734d1; }
  .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 750; }
  .meta { display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #858596; font-size: 11px; }
  .comment-count { display: block; width: fit-content; margin-top: 6px; padding: 3px 7px; border-radius: 6px; background: #f0f0f4; color: #575769; font-size: 12px; font-weight: 650; line-height: 1.3; }
  .comment-count.has-comments { background: #e9e5ff; color: #4938b5; }
  .arrow { color: #8d8da1; font-size: 18px; }
  .empty { padding: 40px 10px; color: #77788a; text-align: center; }
  .preview { position: sticky; top: 20px; padding: 20px; }
  .preview-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .preview h2 { margin: 4px 0 4px; font-size: 22px; letter-spacing: -.035em; }
  .preview-sub { margin: 0; color: #767789; font-size: 12px; line-height: 1.4; word-break: break-word; }
  .reload { flex: none; min-height: 44px; padding: 0 12px; border: 1px solid #dcdce5; border-radius: 9px; background: white; color: #363642; font-weight: 750; cursor: pointer; }
  .stage { display: grid; place-items: center; min-height: 410px; margin: 17px 0; padding: 14px; border-radius: 16px; background: #24232b; }
  .preview-fit { position: relative; width: 390px; height: 844px; }
  .phone { position: absolute; top: 0; left: 0; width: 390px; height: 844px; overflow: hidden; border: 0; border-radius: 23px; background: #fff; outline: 1px solid #202a23; transform-origin: top left; }
  iframe { display: block; width: 390px; height: 844px; border: 0; background: white; }
  .actions { display: flex; flex-wrap: wrap; gap: 9px; }
  .action { display: inline-grid; place-items: center; flex: 1 1 125px; min-height: 44px; padding: 8px 10px; border-radius: 10px; text-align: center; text-decoration: none; font-size: 13px; font-weight: 800; }
  .action[hidden] { display: none; }
  .primary { background: #24232b; color: white; }
  .secondary { background: #efeff3; color: #292935; }
  .note { margin: 12px 0 0; color: #858596; font-size: 11px; line-height: 1.45; }
  @media (max-width: 930px) { .layout { grid-template-columns: 1fr; } .preview { position: static; } .results { max-height: 480px; min-height: 260px; } }
  @media (max-width: 570px) { .shell { padding: 22px 13px 30px; } .header { align-items: flex-start; } .count { font-size: 11px; padding: 8px 10px; } .panel { border-radius: 15px; } .preview { padding: 14px; } .stage { margin: 13px 0; padding: 10px; min-height: 370px; } }
  @media (prefers-reduced-motion: reduce) { .row { transition: none; } .row:hover { transform: none; } }
</style>
