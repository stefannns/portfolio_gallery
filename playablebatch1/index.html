  $('open').href = game.src;
  render();
}
function render() {
  for (const button of filters.children) button.classList.toggle('active', button.textContent === activeGroup);
  const q = search.value.trim().toLowerCase();
  const visible = games.filter(g => (activeGroup === 'All' || g.group === activeGroup) && (!q || (g.name + ' ' + g.base + ' ' + g.group + ' ' + (g.number ?? '')).toLowerCase().includes(q)));
  results.replaceChildren();
  if (!visible.length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'No matching games.'; results.append(empty); return; }
  let last = '';
  for (const game of visible) {
    if (game.group !== last) { const title = document.createElement('h3'); title.className = 'group-title'; title.textContent = game.group; results.append(title); last = game.group; }
    const row = document.createElement('button'); row.type = 'button'; row.className = 'row'; row.classList.toggle('active', current?.base === game.base); row.setAttribute('aria-label', 'Preview ' + game.name);
    const number = document.createElement('span'); number.className = 'number'; number.textContent = game.number ?? '•';
    const body = document.createElement('span'); const name = document.createElement('span'); name.className = 'name'; name.textContent = game.name; const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = game.base; body.append(name, meta);
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.setAttribute('aria-hidden', 'true'); arrow.textContent = '›';
    row.append(number, body, arrow); row.addEventListener('click', () => select(game)); results.append(row);
  }
}
search.addEventListener('input', render);
$('reload').addEventListener('click', () => { if (current) frame.src = current.src; });
render(); select(games.find(game => game.base === location.hash.slice(1)) || games[0]);
</script>
