<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
<script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"BRUSH_RATIO","kind":"number","label":"Iron Size Ratio","value":0.12,"default":0.12,"min":0.05,"max":0.3,"step":0.01},{"id":"PARTICLE_COUNT","kind":"number","label":"Steam Intensity","value":3,"default":3,"min":1,"max":10,"step":1}],"texts":[{"id":"GAME_TITLE","label":"Game Title","value":"Ironing Fuse Beads","default":"Ironing Fuse Beads","max_length":30},{"id":"HINT_TEXT","label":"Hint Text","value":"Move around to reveal!","default":"Move around to reveal!","max_length":50}],"images":[{"id":"BG_PIXEL","label":"Pixel Art (Bottom)","path":"./assets/bg_pixel.webp","replaceable":true},{"id":"BG_BEAD","label":"Fuse Bead (Top)","path":"./assets/bg_bead.webp","replaceable":true},{"id":"CURSOR_IRON","label":"Iron Cursor","path":"./assets/cursor_iron.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"image_expression","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
<style data-guide-centering="20261021">
/* User override 2026-10-21: favor visual center, not a fixed upper band. */
html:root:root:root :is(#root,#game,#stage):is(#root,#game,#stage) p.bead-guide{position:fixed!important;top:26%!important;bottom:auto!important;left:50%!important;right:auto!important;width:max-content!important;max-width:calc(100vw - 60px)!important;min-height:0!important;margin:0!important;text-align:center!important;translate:-50% -50%!important;transform:none!important;pointer-events:none!important;z-index:25!important;overflow-wrap:anywhere}
html:root:root:root .bead-game .bead-board{top:59%!important;width:min(calc(100cqw - 2 * var(--ui-side)),48cqh)!important}
html:root:root:root :is(#root,#game,#stage):is(#root,#game,#stage) p.bead-guide{background:rgba(255,255,255,.94)!important;color:#000!important;font-weight:800!important;padding:8px 14px!important;border:1px solid rgba(28,41,48,.12)!important;border-radius:999px!important;box-shadow:0 3px 10px rgba(0,0,0,.08)!important;text-shadow:none!important}

</style>
<style data-guide-breathing="20261021">
/* Existing guide text only; position, opacity lifecycle and hit regions remain game-owned. */
@keyframes batch-guide-breathe{0%,100%{filter:opacity(1)}50%{filter:opacity(.65)}}
html:root:root :is(p.bead-guide){animation:batch-guide-breathe 2.4s ease-in-out infinite!important}
html[data-guide-breathing-paused]:root:root :is(p.bead-guide){animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){html:root:root :is(p.bead-guide){animation:none!important}}

</style>

</head>
<body>
  <div id="root"></div>
  
  
<script src="./bundle.js"></script>
</body>
</html>
