<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #F2ECFC; -webkit-tap-highlight-color: transparent; }
    button { min-height: 44px; }
  </style>
<style id="feed-entry-motion">
@keyframes feed-prompt-breathe{0%,100%{opacity:1}50%{opacity:.78}}
.feed-first-action{animation:feed-prompt-breathe 2.4s ease-in-out infinite}
.feed-first-action[aria-hidden="true"]{animation:none}
html[data-feed-background] .feed-first-action{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.feed-first-action{animation:none}}
</style>
<style data-guide-breathing="20261021">
/* Existing guide text only; position, opacity lifecycle and hit regions remain game-owned. */
@keyframes batch-guide-breathe{0%,100%{filter:opacity(1)}50%{filter:opacity(.65)}}
html:root:root :is(.entry-demo-copy),html:root:root :is(.one-stroke-guide){animation:batch-guide-breathe 2.4s ease-in-out infinite!important}
html[data-guide-breathing-paused]:root:root :is(.entry-demo-copy,.one-stroke-guide){animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){html:root:root :is(.entry-demo-copy,.one-stroke-guide){animation:none!important}}

</style>

</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"HIT_RADIUS","kind":"number","label":"Hit Node Radius","value":0.12,"default":0.12,"min":0.05,"max":0.25,"step":0.01},{"id":"STROKE_WIDTH","kind":"number","label":"Line Thickness","value":8,"default":8,"min":2,"max":20,"step":1},{"id":"NODE_RADIUS","kind":"number","label":"Node Size","value":14,"default":14,"min":5,"max":30,"step":1}],"texts":[{"id":"GAME_TITLE","label":"Game Title","value":"One Stroke","default":"One Stroke","max_length":20},{"id":"TEXT_LEVEL_PREFIX","label":"Level Prefix","value":"Level","default":"Level","max_length":10},{"id":"BTN_HINT","label":"Hint Button","value":"Hint","default":"Hint","max_length":10},{"id":"BTN_RESET","label":"Reset Button","value":"Reset","default":"Reset","max_length":10},{"id":"TEXT_CONNECT","label":"Instruction","value":"Connect all nodes in one stroke","default":"Connect all nodes in one stroke","max_length":50},{"id":"TEXT_NO_LIFT","label":"Sub Instruction","value":"Don't lift your finger!","default":"Don't lift your finger!","max_length":40},{"id":"TEXT_DEAD_END","label":"Dead End Toast","value":"Dead end. Draw again.","default":"Dead end! Try resetting.","max_length":30},{"id":"TEXT_ALL_CLEAR","label":"All Clear Title","value":"You Did It!","default":"You Did It!","max_length":20},{"id":"TEXT_ALL_CLEAR_SUB","label":"All Clear Subtitle","value":"All 4 puzzles solved.","default":"All 4 puzzles solved.","max_length":40},{"id":"BTN_PLAY_AGAIN","label":"Play Again Button","value":"Play Again","default":"Play Again","max_length":15},{"id":"BTN_POST_PLAY","label":"Post My Play Button","value":"Post My Play","default":"Post My Play","max_length":20}],"images":[],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  
  <!-- playable-inline-config:end -->
  
  

<script src="./bundle.js"></script>
</body>
</html>
