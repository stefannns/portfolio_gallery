<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
    /* The wheel component now sizes from its available stage, preserving its aspect ratio. */
  </style>
<style id="feed-entry-motion">
@keyframes feed-prompt-breathe{0%,100%{opacity:1}50%{opacity:.78}}
.feed-first-action{animation:feed-prompt-breathe 2.4s ease-in-out infinite}
.feed-first-action[aria-hidden="true"]{animation:none}
html[data-feed-background] .feed-first-action{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.feed-first-action{animation:none}}
</style>
<style data-guide-breathing="20261021">
/* Existing guide text only; position, opacity lifecycle and hit regions remain game-owned. */
@keyframes batch-guide-breathe{0%,100%{filter:opacity(1)}50%{filter:opacity(.65)}}
html:root:root :is(.cw-guide){animation:batch-guide-breathe 2.4s ease-in-out infinite!important}
html[data-guide-breathing-paused]:root:root :is(.cw-guide){animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){html:root:root :is(.cw-guide){animation:none!important}}

</style>

</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"INITIAL_SPEED","kind":"number","label":"Initial Speed","value":0.18,"default":0.18,"min":0.05,"max":0.3,"step":0.01},{"id":"SPEED_INCREMENT","kind":"number","label":"Speed Increment","value":0.025,"default":0.025,"min":0.005,"max":0.05,"step":0.001},{"id":"MAX_SPEED","kind":"number","label":"Max Speed","value":0.5,"default":0.5,"min":0.3,"max":1,"step":0.01},{"id":"NEEDLE_PIVOT_Y","kind":"number","label":"Needle Pivot Y (%)","value":82,"default":82,"min":50,"max":100,"step":1},{"id":"NEEDLE_HEIGHT_PERCENT","kind":"number","label":"Needle Height (%)","value":45,"default":45,"min":30,"max":60,"step":1}],"texts":[{"id":"LEVEL_PREFIX","label":"Level Prefix","value":"LEVEL ","default":"LEVEL ","max_length":10},{"id":"TARGET_PREFIX","label":"Target Prefix","value":"TARGET:","default":"TARGET:","max_length":12},{"id":"TAP_RED","label":"Red Target Text","value":"TAP RED","default":"TAP RED","max_length":15},{"id":"TAP_BLUE","label":"Blue Target Text","value":"TAP BLUE","default":"TAP BLUE","max_length":15},{"id":"TAP_YELLOW","label":"Yellow Target Text","value":"TAP YELLOW","default":"TAP YELLOW","max_length":15},{"id":"TIP_TEXT","label":"Bottom Tip","value":"Tap when the needle hits the color!","default":"Tap when the needle hits the color!","max_length":50},{"id":"BTN_RESTART","label":"Restart Button","value":"PLAY AGAIN","default":"PLAY AGAIN","max_length":20},{"id":"POST_PLAY","label":"Post Button","value":"POST MY PLAY","default":"POST MY PLAY","max_length":20}],"images":[{"id":"BG_WHEEL","label":"Color Wheel","path":"./assets/bg_wheel.webp","replaceable":true},{"id":"ICON_NEEDLE","label":"Needle Indicator","path":"./assets/icon_needle.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  
  <!-- playable-inline-config:end -->
  
  

<script src="./bundle.js"></script>
</body>
</html>
