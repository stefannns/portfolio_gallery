<!--
  入口 HTML 模板 —— v3 React 链路的 h5_react_pack 节点（实际由 build.js 执
  行）会把这份模板拷贝进每个 task 的产物目录 dist/，**重命名为 game.html**
  （客户端按 game.html 读 zip 入口，与零构建链路 h5_pack 保持一致）。仓库内
  这份源文件保留 ``index.html`` 名字仅是 Web 项目源码约定。

  为什么不让 LLM 产入口 HTML：
   1. 模板 100% 固定（容器中立 + #root + 加载 bundle.js），无创作空间；
   2. 让 LLM 只关注 App.jsx 一个文件，认知负载最小；
   3. 模板由仓库统一维护，安全策略 / meta 标签 / preload 等可统一升级。

  关于 bundle.css：
   - 当 LLM 用了会抽取 CSS 的 npm 包时，esbuild 会附带产出 dist/bundle.css；
     这里的 <link> 始终保留即可。
   - 没有用到任何带 CSS 的库时，esbuild 不产 bundle.css，浏览器对该 link
     会静默 404（不阻塞 JS 执行、不影响玩法），可放心忽略。
-->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tostapane</title>
  <style>
    /* 容器中立硬规：html / body / #root 三层撑满 + overflow:hidden + 无 vh/vw */
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
<script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"TOAST_DURATION","kind":"number","label":"烤面包时长(ms)","value":2500,"default":2500,"min":1000,"max":5000,"step":100}],"texts":[{"id":"RESULT_TEXT","label":"结果文案","value":"Bruciato!","default":"Bruciato!","max_length":20}],"images":[{"id":"TOASTER_IMG","label":"烤面包机","path":"./assets/toaster.webp","replaceable":true},{"id":"HANDLE_IMG","label":"手柄","path":"./assets/toaster_handle.webp","replaceable":true},{"id":"NORMAL_BREAD_IMG","label":"正常面包","path":"./assets/normal_bread.webp","replaceable":true},{"id":"BURNT_BREAD_IMG","label":"烤焦面包","path":"./assets/burnt_bread.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game"}}</script>
<style data-guide-centering="20261021">
/* User override 2026-10-21: favor visual center, not a fixed upper band. */

</style>
<style data-guide-breathing="20261021">
/* Existing guide text only; position, opacity lifecycle and hit regions remain game-owned. */
@keyframes batch-guide-breathe{0%,100%{filter:opacity(1)}50%{filter:opacity(.65)}}
html:root:root :is(p.toaster-guide){animation:batch-guide-breathe 2.4s ease-in-out infinite!important}
html[data-guide-breathing-paused]:root:root :is(p.toaster-guide){animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){html:root:root :is(p.toaster-guide){animation:none!important}}

</style>
