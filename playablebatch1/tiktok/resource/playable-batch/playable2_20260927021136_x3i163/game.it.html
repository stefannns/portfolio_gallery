 const selectors=[".meeting-cube-heading>div>p"],copy=new Set([].map(s=>s.replace(/\s+/g,' ').trim().toLowerCase()));

 function scan(){

   if(text.length>=5&&text.length<=140&&(copy.has(text.toLowerCase())||(!selectors.length&&action.test(text))))targets.add(el);
  }

  }

})();
