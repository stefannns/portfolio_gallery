<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-config-inline" type="application/json">{
  "tweaks": [
    {
      "id": "TILT_SENSITIVITY",
      "kind": "number",
      "label": "Tilt Sensitivity",
      "value": 0.8,
      "default": 0.8,
      "min": 0.5,
      "max": 2.5,
      "step": 0.1
    },
    {
      "id": "TRACK_WIDTH",
      "kind": "number",
      "label": "Track Width",
      "value": 90,
      "default": 90,
      "min": 50,
      "max": 150,
      "step": 5
    },
    {
      "id": "BALL_MASS",
      "kind": "number",
      "label": "Ball Mass",
      "value": 1,
      "default": 1,
      "min": 0.5,
      "max": 3,
      "step": 0.1
    }
  ],
  "texts": [
    {
      "id": "GAME_TITLE",
      "label": "Game Title",
      "value": "Physics 2.0",
      "default": "Physics 2.0",
      "max_length": 20
    },
    {
      "id": "TXT_TAP_START",
      "label": "Start Motion Button",
      "value": "Start Motion",
      "default": "Start Motion",
      "max_length": 30
    },
    {
      "id": "TXT_DOUBLE_TAP",
      "label": "Calibrate Prompt",
      "value": "Double tap outside to reset",
      "default": "Double tap outside to reset",
      "max_length": 30
    },
    {
      "id": "TXT_WIN",
      "label": "Win Text",
      "value": "STAGE CLEARED!",
      "default": "STAGE CLEARED!",
      "max_length": 20
    },
    {
      "id": "TXT_LOSE",
      "label": "Lose Text",
      "value": "YOU FELL!",
      "default": "YOU FELL!",
      "max_length": 20
    },
    {
      "id": "TXT_RESTART",
      "label": "Restart Button",
      "value": "PLAY AGAIN",
      "default": "PLAY AGAIN",
      "max_length": 20
    }
  ],
  "images": [
    {
      "id": "BG_MAIN",
      "label": "Background",
      "path": "./assets/rolling_backdrop.svg",
      "replaceable": true
    }
  ],
  "config_version": "2.0",
  "playable": {
    "post_id": "99278216753389841",
    "version_id": "99278216753423966",
    "runtime_target": "h5",
    "h5_playstyle_type": "general_game",
    "content_locale": "en",
    "min_capability_level": 1,
    "full_capability_level": 1
  }
}</script>
  <script>
    // file:// pages cannot fetch their adjacent JSON in Chrome. Keep the normal
    // package fetch path on HTTP, and serve only the local config from this copy.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
