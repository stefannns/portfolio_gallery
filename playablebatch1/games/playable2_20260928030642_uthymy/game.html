<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #root { isolation: isolate; }
    canvas { touch-action: none; }
    button, input, select, textarea { touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-inline-config" type="application/json">
  {
    "tweaks": [
      {
        "id": "TRIES_BASE",
        "kind": "number",
        "label": "Base Tries",
        "value": 6,
        "default": 6,
        "min": 3,
        "max": 10,
        "step": 1
      },
      {
        "id": "PEELER_SPEED",
        "kind": "number",
        "label": "Peeler Speed",
        "value": 0.08,
        "default": 0.08,
        "min": 0.02,
        "max": 0.2,
        "step": 0.01
      },
      {
        "id": "DROP_SPEED",
        "kind": "number",
        "label": "Drop Speed",
        "value": 0.3,
        "default": 0.3,
        "min": 0.1,
        "max": 1.0,
        "step": 0.05
      },
      {
        "id": "PEEL_WIDTH",
        "kind": "number",
        "label": "Peel Width",
        "value": 46.8,
        "default": 46.8,
        "min": 20,
        "max": 80,
        "step": 4
      }
    ],
    "texts": [
      {
        "id": "TXT_PERFECT",
        "label": "Perfect Peel Text",
        "value": "Perfect Peel!",
        "default": "Perfect Peel!",
        "max_length": 20
      },
      {
        "id": "TXT_FAIL_TITLE",
        "label": "Fail Title",
        "value": "Out of Peels!",
        "default": "Out of Peels!",
        "max_length": 20
      },
      {
        "id": "TXT_FAIL_DESC",
        "label": "Fail Desc",
        "value": "Peel 100% within 5 peels to win.",
        "default": "Peel 100% within 5 peels to win.",
        "max_length": 60
      },
      {
        "id": "TXT_CLEAR_TITLE",
        "label": "Clear Title",
        "value": "Challenge Complete!",
        "default": "Challenge Complete!",
        "max_length": 30
      },
      {
        "id": "TXT_CLEAR_DESC",
        "label": "Clear Desc",
        "value": "You really know how to peel potatoes!",
        "default": "You really know how to peel potatoes!",
        "max_length": 60
      },
      {
        "id": "TXT_POST",
        "label": "Post Button Text",
        "value": "Post My Play",
        "default": "Post My Play",
        "max_length": 20
      }
    ],
    "images": [
      {
        "id": "PEELER_IMG",
        "label": "Peeler Sprite",
        "path": "./assets/peeler.webp",
        "replaceable": true
      },
      {
        "id": "POTATO_UNPEELED",
        "label": "Unpeeled Potato",
        "path": "./assets/potato_unpeeled_v2.webp",
        "replaceable": true
      },
      {
        "id": "POTATO_PEELED",
        "label": "Peeled Potato",
        "path": "./assets/potato_peeled_v2.webp",
        "replaceable": true
      }
    ],
    "config_version": "2.0",
    "playable": {
      "runtime_target": "h5",
      "h5_playstyle_type": "general_game",
      "content_locale": "en",
      "min_capability_level": 1,
      "full_capability_level": 1
    }
  }
  </script>
  <script>
    (() => {
      if (window.location.protocol !== "file:" || !window.fetch) return;
      const configNode = document.getElementById("playable-inline-config");
      if (!configNode) return;
      let inlineConfig;
      try { inlineConfig = JSON.parse(configNode.textContent); } catch (_) { return; }
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === "string" ? input : input && input.url;
        if (url === "./game.config.json" || url === "game.config.json") {
          return Promise.resolve(new Response(JSON.stringify(inlineConfig), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
