<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <link rel="stylesheet" href="./bundle.css" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
    button { min-height: 44px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"HIT_RADIUS","kind":"number","label":"Hit Node Radius","value":0.12,"default":0.12,"min":0.05,"max":0.25,"step":0.01},{"id":"STROKE_WIDTH","kind":"number","label":"Line Thickness","value":8,"default":8,"min":2,"max":20,"step":1},{"id":"NODE_RADIUS","kind":"number","label":"Node Size","value":14,"default":14,"min":5,"max":30,"step":1}],"texts":[{"id":"GAME_TITLE","label":"Game Title","value":"One Stroke","default":"One Stroke","max_length":20},{"id":"TEXT_LEVEL_PREFIX","label":"Level Prefix","value":"Level","default":"Level","max_length":10},{"id":"BTN_HINT","label":"Hint Button","value":"Hint","default":"Hint","max_length":10},{"id":"BTN_RESET","label":"Reset Button","value":"Reset","default":"Reset","max_length":10},{"id":"TEXT_CONNECT","label":"Instruction","value":"Connect all nodes in one stroke","default":"Connect all nodes in one stroke","max_length":50},{"id":"TEXT_NO_LIFT","label":"Sub Instruction","value":"Don't lift your finger!","default":"Don't lift your finger!","max_length":40},{"id":"TEXT_DEAD_END","label":"Dead End Toast","value":"Dead end! Try resetting.","default":"Dead end! Try resetting.","max_length":30},{"id":"TEXT_ALL_CLEAR","label":"All Clear Title","value":"You Did It!","default":"You Did It!","max_length":20},{"id":"TEXT_ALL_CLEAR_SUB","label":"All Clear Subtitle","value":"All 9 puzzles solved.","default":"All 9 puzzles solved.","max_length":40},{"id":"BTN_PLAY_AGAIN","label":"Play Again Button","value":"Play Again","default":"Play Again","max_length":15},{"id":"BTN_POST_PLAY","label":"Post My Play Button","value":"Post My Play","default":"Post My Play","max_length":20}],"images":[],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  <script>
    (function () {
      if (window.location.protocol !== 'file:') return;
      var configText = document.getElementById('playable-inline-config').textContent;
      var nativeFetch = window.fetch;
      window.fetch = function (input) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (/(^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: function () { return Promise.resolve(JSON.parse(configText)); },
            text: function () { return Promise.resolve(configText); }
          });
        }
        return nativeFetch.apply(window, arguments);
      };
    }());
  </script>
  <!-- playable-inline-config:end -->
  <script src="./bundle.js?v=simplified-one-stroke-1"></script>
</body>
</html>
