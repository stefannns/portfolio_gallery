<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <link rel="stylesheet" href="./bundle.css" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
    button { min-height: 44px; }
    /* Iteration repair: keep every activity tab visible within the portrait viewport. */
    #root > div > div > div:first-child button {
      flex: 1 1 0 !important;
      min-width: 0 !important;
      padding: 10px 6px !important;
      font-size: 12px !important;
    }
    /* The cover CTA is not a tab: retain its natural horizontal button shape. */
    #root h1 + img + button {
      flex: 0 0 auto !important;
      width: auto !important;
      min-width: 168px;
      min-height: 52px;
      padding: 16px 40px !important;
    }
    button[style*="c-pink-mid"] {
      color: #9f2149 !important;
      border-color: #c43b66 !important;
    }
    /* Scale the activity grid rather than letting bubbles cover tabs or Reset. */
    @media (max-height: 600px) {
      #root > div > div > div:nth-of-type(1) { padding: 40px 10px 8px !important; gap: 6px !important; }
      #root > div > div > div:nth-of-type(2) > div { padding: 8px !important; }
      #root > div > div > div:nth-of-type(2) > div > div { max-width: 250px !important; max-height: 285px !important; aspect-ratio: 5 / 6 !important; gap: 6px !important; }
      #root > div > div > div:nth-of-type(3) { padding: 8px 20px 40px !important; }
      #root h1 { margin-bottom: 16px !important; }
      #root h1 + img { max-height: 210px !important; width: auto !important; }
      #root h1 + img + button { margin-top: 16px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"SPINNER_FRICTION","kind":"number","label":"Spinner Friction","value":0.98,"default":0.98,"min":0.9,"max":0.999,"step":0.001},{"id":"SAND_BRUSH_SIZE","kind":"number","label":"Sand Brush Size","value":15,"default":15,"min":5,"max":40,"step":1}],"texts":[{"id":"BOOK_TITLE","label":"Book Title","value":"Pink ASMR Book","default":"Pink ASMR Book","max_length":30},{"id":"COVER_INSTRUCTION","label":"Cover Instruction","value":"Tap to Open","default":"Tap to Open","max_length":25},{"id":"TAB_BUBBLE","label":"Bubble Tab","value":"Bubble Wrap","default":"Bubble Wrap","max_length":15},{"id":"TAB_SAND","label":"Sand Tab","value":"Sand Art","default":"Sand Art","max_length":15},{"id":"TAB_SPINNER","label":"Spinner Tab","value":"Spinner","default":"Spinner","max_length":15},{"id":"BTN_RESET","label":"Reset Button","value":"Reset","default":"Reset","max_length":20}],"images":[{"id":"BG_COVER","label":"Cover Background","path":"./assets/bg_cover.webp","replaceable":true},{"id":"IMG_SPINNER","label":"Spinner Image","path":"./assets/img_spinner.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  <script>
    (function () {
      if (window.location.protocol !== 'file:') return;
      var configText = document.getElementById('playable-inline-config').textContent;
      var nativeFetch = window.fetch;
      window.fetch = function (input) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (/(^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: function () { return Promise.resolve(JSON.parse(configText)); },
            text: function () { return Promise.resolve(configText); }
          });
        }
        return nativeFetch.apply(window, arguments);
      };
    }());
  </script>
  <!-- playable-inline-config:end -->
  <script src="./bundle.js?v=no-squishy-1"></script>
</body>
</html>
