<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-config-inline" type="application/json">{
  "tweaks": [
    {
      "id": "FLUID_DISSIPATION",
      "kind": "number",
      "label": "Particle Fade Speed",
      "value": 2,
      "default": 2,
      "min": 0.5,
      "max": 5,
      "step": 0.1
    },
    {
      "id": "SCRUB_SENSITIVITY",
      "kind": "number",
      "label": "Scrub Sensitivity",
      "value": 0.3,
      "default": 0.3,
      "min": 0.1,
      "max": 1,
      "step": 0.1
    },
    {
      "id": "SHOW_PROGRESS",
      "kind": "boolean",
      "label": "Show Progress Bar",
      "value": false,
      "default": false
    }
  ],
  "texts": [
    {
      "id": "TXT_TITLE",
      "label": "Main Title",
      "value": "Snake",
      "default": "Snake",
      "max_length": 25
    },
    {
      "id": "TXT_HINT",
      "label": "Hint Text",
      "value": "Use the arrows to eat food and grow.",
      "default": "Use the arrows to eat food and grow.",
      "max_length": 50
    }
  ],
  "images": [
    {
      "id": "BG_STONE",
      "label": "Stone Tablet",
      "path": "./assets/motion/reveal.svg",
      "replaceable": true
    }
  ],
  "motions": [
    {
      "id": "MOTION_REVEAL",
      "label": "Reveal Text Motion",
      "base_path": "./assets/motion/reveal.svg",
      "frame_count": 24,
      "duration": 5,
      "aspect_ratio": "9:16"
    }
  ],
  "config_version": "2.0",
  "playable": {
    "post_id": "99279521022691650",
    "version_id": "99279521022601594",
    "runtime_target": "h5",
    "h5_playstyle_type": "image_expression",
    "content_locale": "en",
    "min_capability_level": 1,
    "full_capability_level": 1
  }
}</script>
  <script>
    // Support direct local preview without changing the normal HTTP/platform path.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
