<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <link rel="stylesheet" href="./bundle.css" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
    /* Iteration repair: replace the narrow screenshot texture with readable note zones. */
    img[alt="background overlay"] { display: none !important; }
    #root::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(90deg,
        rgba(69,189,255,.13) 0,
        rgba(69,189,255,.13) calc(20% - 1px),
        rgba(255,255,255,.38) calc(20% - 1px),
        rgba(255,255,255,.38) 20%);
    }
    #root::after {
      content: "C4        D4        E4        G4        A4";
      position: fixed;
      left: 0;
      right: 0;
      top: max(40px, env(safe-area-inset-top));
      z-index: 3;
      color: rgba(255,255,255,.8);
      font: 700 12px/1 Arial, sans-serif;
      text-align: center;
      white-space: pre;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"GLOW_INTENSITY","kind":"number","label":"Glow Intensity","value":15,"default":15,"min":5,"max":40,"step":1},{"id":"LINE_WIDTH","kind":"number","label":"Line Width","value":4,"default":4,"min":1,"max":12,"step":0.5},{"id":"TRAIL_LIFE","kind":"number","label":"Trail Duration (ms)","value":1500,"default":1500,"min":500,"max":5000,"step":100}],"texts":[{"id":"TITLE","label":"Game Title","value":"Melody Canvas","default":"Melody Canvas","max_length":24},{"id":"BTN_START","label":"Start Button","value":"START","default":"START","max_length":12}],"images":[{"id":"BG_OVERLAY","label":"Background Texture","path":"./assets/bg_overlay.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  <script>
    (function () {
      if (window.location.protocol !== 'file:') return;
      var configText = document.getElementById('playable-inline-config').textContent;
      var nativeFetch = window.fetch;
      window.fetch = function (input) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (/(^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: function () { return Promise.resolve(JSON.parse(configText)); },
            text: function () { return Promise.resolve(configText); }
          });
        }
        return nativeFetch.apply(window, arguments);
      };
    }());
  </script>
  <!-- playable-inline-config:end -->
  <script src="./bundle.js"></script>
</body>
</html>
