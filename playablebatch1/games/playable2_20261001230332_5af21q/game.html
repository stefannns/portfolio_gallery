<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-config-inline" type="application/json">{
  "tweaks": [
    {
      "id": "SPEED_INITIAL",
      "kind": "number",
      "label": "Initial Speed",
      "value": 0.04,
      "default": 0.04,
      "min": 0.02,
      "max": 0.1,
      "step": 0.01
    },
    {
      "id": "DENSITY",
      "kind": "number",
      "label": "Traffic Density",
      "value": 1500,
      "default": 1500,
      "min": 800,
      "max": 3000,
      "step": 100
    },
    {
      "id": "LANE_SPEED",
      "kind": "number",
      "label": "Steering Speed",
      "value": 0.05,
      "default": 0.05,
      "min": 0.02,
      "max": 0.1,
      "step": 0.01
    }
  ],
  "texts": [
    {
      "id": "GAME_TITLE",
      "label": "Game Title",
      "value": "POCKET RACER",
      "default": "POCKET RACER",
      "max_length": 20
    },
    {
      "id": "BTN_START",
      "label": "Start Button",
      "value": "Start Race",
      "default": "Start Race",
      "max_length": 15
    },
    {
      "id": "BTN_RESTART",
      "label": "Restart Button",
      "value": "Play Again",
      "default": "Play Again",
      "max_length": 15
    },
    {
      "id": "TXT_POST",
      "label": "Post Button",
      "value": "Post My Play",
      "default": "Post My Play",
      "max_length": 20
    }
  ],
  "images": [
    {
      "id": "CHAR_PLAYER",
      "label": "Player Car",
      "path": "./assets/car_player.svg",
      "replaceable": true
    },
    {
      "id": "IMG_TRAFFIC_RED",
      "label": "Red Traffic Car",
      "path": "./assets/car_traffic_red.svg",
      "replaceable": true
    },
    {
      "id": "IMG_TRAFFIC_BLUE",
      "label": "Blue Traffic Car",
      "path": "./assets/car_traffic_blue.svg",
      "replaceable": true
    },
    {
      "id": "IMG_TRAFFIC_PURPLE",
      "label": "Purple Traffic Car",
      "path": "./assets/car_traffic_purple.svg",
      "replaceable": true
    }
  ],
  "config_version": "2.0",
  "playable": {
    "post_id": "99280066550480227",
    "version_id": "99280066554654271",
    "runtime_target": "h5",
    "h5_playstyle_type": "general_game",
    "content_locale": "en",
    "min_capability_level": 1,
    "full_capability_level": 1
  }
}</script>
  <script>
    // Support direct local preview without changing the normal HTTP/platform path.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
