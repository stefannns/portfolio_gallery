html[data-feed-background] .feed-first-action{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.feed-first-action{animation:none}}

<body>

  "texts": [

    },

  ],
  "images": [],
  "motions": [

    "full_capability_level": 1

}</script>
  <script>
    // Support direct local preview without changing the normal HTTP/platform path.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./bundle.js"></script>
  <script>
    (() => {
      const FRAME_BLEND_MS = 285;

      function installSmoothSky() {
        const stage = document.querySelector("#root main");
        const source = stage && stage.querySelector(":scope > img");
        if (!stage || !source) {
          requestAnimationFrame(installSmoothSky);
          return;
        }

        const layer = document.createElement("div");
        layer.setAttribute("aria-hidden", "true");
        Object.assign(layer.style, {
          position: "absolute",
          inset: "0",
          overflow: "hidden",
          pointerEvents: "none",
          zIndex: "0"
        });

        const frames = [document.createElement("img"), document.createElement("img")];
        frames.forEach(frame => {
          frame.alt = "";
          frame.draggable = false;
          Object.assign(frame.style, {
            position: "absolute",
            inset: "0",
            width: "100%",
            height: "100%",
            objectFit: "cover",
            opacity: "0",
            transition: `opacity ${FRAME_BLEND_MS}ms linear`,
            willChange: "opacity",
            pointerEvents: "none"
          });
          layer.appendChild(frame);
        });

        stage.insertBefore(layer, source);
        source.style.opacity = "0";
        source.style.pointerEvents = "none";

        let active = 0;
        let currentSrc = "";
        let firstFrame = true;

        function blendToSource() {
          const nextSrc = source.currentSrc || source.src;
          if (!nextSrc || nextSrc === currentSrc) return;
          currentSrc = nextSrc;

          const incomingIndex = firstFrame ? active : 1 - active;
          const outgoingIndex = firstFrame ? 1 - active : active;
          const incoming = frames[incomingIndex];
          const outgoing = frames[outgoingIndex];
          let revealed = false;

          const reveal = () => {
            if (revealed || incoming.src !== nextSrc) return;
            revealed = true;
            if (firstFrame) {
              incoming.style.transition = "none";
              incoming.style.opacity = "1";
              requestAnimationFrame(() => {
                incoming.style.transition = `opacity ${FRAME_BLEND_MS}ms linear`;
              });
              firstFrame = false;
            } else {
              incoming.style.transition = "none";
              incoming.style.opacity = "0";
              incoming.getBoundingClientRect();
              incoming.style.transition = `opacity ${FRAME_BLEND_MS}ms linear`;
              outgoing.style.transition = `opacity ${FRAME_BLEND_MS}ms linear`;
              incoming.style.opacity = "1";
              outgoing.style.opacity = "0";
            }
            active = incomingIndex;
          };

          incoming.onload = reveal;
          incoming.src = nextSrc;
          if (incoming.complete) reveal();
        }

        const observer = new MutationObserver(blendToSource);
        observer.observe(source, { attributes: true, attributeFilter: ["src"] });
        blendToSource();
      }

      installSmoothSky();
    })();
  </script>
<script defer src="./feed-entry-motion.js?v=feed-first-20261008-1" data-subject="#root img, #root canvas"></script>
