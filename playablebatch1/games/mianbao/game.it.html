<!--
  入口 HTML 模板 —— v3 React 链路的 h5_react_pack 节点（实际由 build.js 执
  行）会把这份模板拷贝进每个 task 的产物目录 dist/，**重命名为 game.html**
  （客户端按 game.html 读 zip 入口，与零构建链路 h5_pack 保持一致）。仓库内
  这份源文件保留 ``index.html`` 名字仅是 Web 项目源码约定。

  为什么不让 LLM 产入口 HTML：
   1. 模板 100% 固定（容器中立 + #root + 加载 bundle.js），无创作空间；
   2. 让 LLM 只关注 App.jsx 一个文件，认知负载最小；
   3. 模板由仓库统一维护，安全策略 / meta 标签 / preload 等可统一升级。

  关于 bundle.css：
   - 当 LLM 用了会抽取 CSS 的 npm 包时，esbuild 会附带产出 dist/bundle.css；
     这里的 <link> 始终保留即可。
   - 没有用到任何带 CSS 的库时，esbuild 不产 bundle.css，浏览器对该 link
     会静默 404（不阻塞 JS 执行、不影响玩法），可放心忽略。
-->
