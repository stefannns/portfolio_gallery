<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #root { isolation: isolate; }
    canvas { touch-action: none; }
    button, input, select, textarea { touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-inline-config" type="application/json">
  {
    "tweaks": [
      {
        "id": "CASH_PER_BOUNCE",
        "kind": "number",
        "label": "Cash Per Bounce",
        "value": 1,
        "default": 1,
        "min": 1,
        "max": 100,
        "step": 1
      },
      {
        "id": "INITIAL_BALL_COST",
        "kind": "number",
        "label": "Initial Ball Cost",
        "value": 1,
        "default": 1,
        "min": 1,
        "max": 10,
        "step": 1
      },
      {
        "id": "COST_INCREMENT",
        "kind": "number",
        "label": "Cost Increment per Ball",
        "value": 1,
        "default": 1,
        "min": 1,
        "max": 50,
        "step": 1
      },
      {
        "id": "SPEED_MULTIPLIER",
        "kind": "number",
        "label": "Bounce Speed Multiplier",
        "value": 1.03,
        "default": 1.03,
        "min": 1.0,
        "max": 1.5,
        "step": 0.01
      },
      {
        "id": "MAX_SPEED",
        "kind": "number",
        "label": "Max Ball Speed",
        "value": 13,
        "default": 13,
        "min": 10,
        "max": 30,
        "step": 1
      }
    ],
    "texts": [
      {
        "id": "TEXT_CASH_EARNED",
        "label": "Cash Earned Label",
        "value": "CASH EARNED",
        "default": "CASH EARNED",
        "max_length": 20
      },
      {
        "id": "BTN_ADD_BALL",
        "label": "Add Ball Button Text",
        "value": "ADD BALL",
        "default": "ADD BALL",
        "max_length": 15
      },
      {
        "id": "TEXT_DRAW_HINT",
        "label": "Draw Hint Text",
        "value": "DRAW CIRCLES TO TRAP BALLS",
        "default": "DRAW CIRCLES TO TRAP BALLS",
        "max_length": 40
      }
    ],
    "images": [],
    "config_version": "2.0",
    "playable": {
      "runtime_target": "h5",
      "h5_playstyle_type": "general_game",
      "content_locale": "en",
      "min_capability_level": 1,
      "full_capability_level": 1
    }
  }
  </script>
  <script>
    (() => {
      if (window.location.protocol !== "file:" || !window.fetch) return;
      const configNode = document.getElementById("playable-inline-config");
      if (!configNode) return;
      let inlineConfig;
      try { inlineConfig = JSON.parse(configNode.textContent); } catch (_) { return; }
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === "string" ? input : input && input.url;
        if (url === "./game.config.json" || url === "game.config.json") {
          return Promise.resolve(new Response(JSON.stringify(inlineConfig), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
