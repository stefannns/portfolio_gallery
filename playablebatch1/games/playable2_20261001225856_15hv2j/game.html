<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
<style id="feed-entry-motion">
@keyframes feed-prompt-breathe{0%,100%{opacity:1}50%{opacity:.78}}
.feed-first-action{animation:feed-prompt-breathe 2.4s ease-in-out infinite}
.feed-first-action[aria-hidden="true"]{animation:none}
html[data-feed-background] .feed-first-action{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.feed-first-action{animation:none}}
</style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-config-inline" type="application/json">{
  "tweaks": [
    {
      "id": "TILT_THRESHOLD",
      "kind": "number",
      "label": "Tilt Threshold",
      "value": 0.25,
      "default": 0.25,
      "min": 0.1,
      "max": 0.8,
      "step": 0.05
    }
  ],
  "texts": [
    {
      "id": "GAME_TITLE",
      "label": "Game Title",
      "value": "2048",
      "default": "2048",
      "max_length": 15
    },
    {
      "id": "TXT_SCORE",
      "label": "Score Label",
      "value": "SCORE",
      "default": "SCORE",
      "max_length": 10
    },
    {
      "id": "TXT_GAME_OVER",
      "label": "Game Over Text",
      "value": "Game Over!",
      "default": "Game Over!",
      "max_length": 20
    },
    {
      "id": "TXT_RESTART",
      "label": "Restart Button",
      "value": "Try Again",
      "default": "Try Again",
      "max_length": 15
    },
    {
      "id": "TXT_INSTRUCTION",
      "label": "Instruction",
      "value": "Tap to drop balls. Match equal numbers to merge.",
      "default": "Tap to drop balls. Match equal numbers to merge.",
      "max_length": 40
    },
    {
      "id": "TXT_POST_PLAY",
      "label": "Post Play Button",
      "value": "Post My Play",
      "default": "Post My Play",
      "max_length": 20
    }
  ],
  "images": [
    {
      "id": "BG_MAIN",
      "label": "Main Background",
      "path": "./assets/bg_main.webp",
      "replaceable": true
    }
  ],
  "config_version": "2.0",
  "playable": {
    "post_id": "99278910617068396",
    "version_id": "99278910617179240",
    "runtime_target": "h5",
    "h5_playstyle_type": "general_game",
    "content_locale": "en",
    "min_capability_level": 1,
    "full_capability_level": 1
  }
}</script>
  <script>
    // Support direct local preview without changing the normal HTTP/platform path.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./bundle.js?ui=c4c22abbd022"></script>
<script defer src="./feed-entry-motion.js?v=feed-first-20261008-1" data-subject="#root canvas"></script>
</body>
