<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #root { isolation: isolate; }
    canvas { touch-action: none; }
    button, input, select, textarea { touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-inline-config" type="application/json">
  {
    "tweaks": [
      {
        "id": "ENEMY_SPAWN_INTERVAL",
        "kind": "number",
        "label": "Enemy Spawn Interval",
        "value": 1500,
        "default": 1500,
        "min": 500,
        "max": 3000,
        "step": 100
      },
      {
        "id": "MAX_ENEMIES",
        "kind": "number",
        "label": "Max Enemies",
        "value": 40,
        "default": 40,
        "min": 10,
        "max": 100,
        "step": 5
      },
      {
        "id": "PLAYER_SPEED",
        "kind": "number",
        "label": "Player Speed",
        "value": 0.15,
        "default": 0.15,
        "min": 0.05,
        "max": 0.3,
        "step": 0.01
      }
    ],
    "texts": [
      {
        "id": "GAME_TITLE",
        "label": "Game Title",
        "value": "Army Commander",
        "default": "Army Commander",
        "max_length": 30
      },
      {
        "id": "TXT_VICTORY",
        "label": "Victory Text",
        "value": "VICTORY",
        "default": "VICTORY",
        "max_length": 20
      },
      {
        "id": "TXT_TRY_AGAIN",
        "label": "Try Again Button",
        "value": "Try Again",
        "default": "Try Again",
        "max_length": 20
      },
      {
        "id": "TXT_POST",
        "label": "Post Button",
        "value": "Post My Play",
        "default": "Post My Play",
        "max_length": 20
      },
      {
        "id": "TXT_ALL_CLEARED",
        "label": "Victory Subtext",
        "value": "You crushed the enemy!",
        "default": "You crushed the enemy!",
        "max_length": 50
      }
    ],
    "images": [
      {
        "id": "UI_DEFEAT_PANEL",
        "label": "Defeat Panel",
        "path": "./assets/ui_defeat_panel.png",
        "replaceable": true
      }
    ],
    "config_version": "2.0",
    "playable": {
      "runtime_target": "h5",
      "h5_playstyle_type": "general_game",
      "content_locale": "en",
      "min_capability_level": 1,
      "full_capability_level": 1
    }
  }
  </script>
  <script>
    (() => {
      if (window.location.protocol !== "file:" || !window.fetch) return;
      const configNode = document.getElementById("playable-inline-config");
      if (!configNode) return;
      let inlineConfig;
      try { inlineConfig = JSON.parse(configNode.textContent); } catch (_) { return; }
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === "string" ? input : input && input.url;
        if (url === "./game.config.json" || url === "game.config.json") {
          return Promise.resolve(new Response(JSON.stringify(inlineConfig), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
