<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #root { isolation: isolate; }
    canvas { touch-action: none; }
    button, input, select, textarea { touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="playable-inline-config" type="application/json">
  {
    "tweaks": [
      {
        "id": "MAZE_SIZE",
        "kind": "number",
        "label": "Maze Size",
        "value": 15,
        "default": 15,
        "min": 10,
        "max": 25,
        "step": 1
      },
      {
        "id": "VISION_RADIUS",
        "kind": "number",
        "label": "Vision Radius",
        "value": 18,
        "default": 18,
        "min": 10,
        "max": 40,
        "step": 1
      },
      {
        "id": "MONSTER_COUNT",
        "kind": "number",
        "label": "Monster Count",
        "value": 4,
        "default": 4,
        "min": 0,
        "max": 10,
        "step": 1
      }
    ],
    "texts": [
      {
        "id": "GAME_TITLE",
        "label": "Title",
        "value": "THE MAZE OF HORROR",
        "default": "THE MAZE OF HORROR",
        "max_length": 25
      },
      {
        "id": "SUB_TITLE",
        "label": "Subtitle",
        "value": "Find the exit before you get lost",
        "default": "Find the exit before you get lost",
        "max_length": 40
      },
      {
        "id": "MSG_WIN",
        "label": "Win Message",
        "value": "YOU ESCAPED!",
        "default": "YOU ESCAPED!",
        "max_length": 20
      },
      {
        "id": "BTN_RESTART",
        "label": "Restart Button",
        "value": "PLAY AGAIN",
        "default": "PLAY AGAIN",
        "max_length": 15
      }
    ],
    "images": [
      {
        "id": "CHAR_PLAYER",
        "label": "Player Icon",
        "path": "./assets/char_player.webp",
        "replaceable": true
      },
      {
        "id": "ICON_MONSTER",
        "label": "Monster Icon",
        "path": "./assets/icon_monster.svg",
        "replaceable": true
      }
    ],
    "config_version": "2.0",
    "playable": {
      "runtime_target": "h5",
      "h5_playstyle_type": "general_game",
      "content_locale": "en",
      "min_capability_level": 1,
      "full_capability_level": 1
    }
  }
  </script>
  <script>
    (() => {
      if (window.location.protocol !== "file:" || !window.fetch) return;
      const configNode = document.getElementById("playable-inline-config");
      if (!configNode) return;
      let inlineConfig;
      try { inlineConfig = JSON.parse(configNode.textContent); } catch (_) { return; }
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === "string" ? input : input && input.url;
        if (url === "./game.config.json" || url === "game.config.json") {
          return Promise.resolve(new Response(JSON.stringify(inlineConfig), {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return nativeFetch(input, init);
      };
    })();
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
