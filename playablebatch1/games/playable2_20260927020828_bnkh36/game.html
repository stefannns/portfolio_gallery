<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <link rel="stylesheet" href="./bundle.css" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
    /* Iteration repair: the supplied full-heart bitmap is blank, so render a clear state icon. */
    img[src*="ui_heart_full"] {
      content: "";
      background: #e63946;
      clip-path: polygon(50% 94%, 8% 54%, 4% 31%, 12% 13%, 27% 5%, 42% 10%, 50% 23%, 58% 10%, 73% 5%, 88% 13%, 96% 31%, 92% 54%);
      filter: brightness(0) saturate(100%) invert(28%) sepia(91%) saturate(3374%) hue-rotate(339deg) brightness(93%) contrast(90%) drop-shadow(0 2px 1px #8f1822) drop-shadow(0 3px 5px rgba(0,0,0,.24));
    }
    /* Active play screen: keep HUD and decision controls inside portrait safe zones. */
    #root > div > div > div:nth-of-type(1) { padding-top: 40px !important; }
    #root > div > div > div:nth-of-type(4) { padding-bottom: 48px !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"INITIAL_TIME","kind":"number","label":"Initial Time Limit (ms)","value":3000,"default":3000,"min":1000,"max":5000,"step":100},{"id":"MIN_TIME","kind":"number","label":"Minimum Time Limit (ms)","value":800,"default":800,"min":300,"max":1500,"step":50},{"id":"TIME_DECREMENT","kind":"number","label":"Time Decrease per Correct (ms)","value":100,"default":100,"min":10,"max":200,"step":10},{"id":"SCORE_PER_CORRECT","kind":"number","label":"Score per Correct Decision","value":10,"default":10,"min":1,"max":100,"step":1}],"texts":[{"id":"GAME_TITLE","label":"Game Title","value":"Fridge Inspector","default":"Fridge Inspector","max_length":20},{"id":"BTN_START","label":"Start Button","value":"START","default":"START","max_length":10},{"id":"BTN_EAT","label":"Eat Button","value":"EAT","default":"EAT","max_length":10},{"id":"BTN_PASS","label":"Pass Button","value":"PASS","default":"PASS","max_length":10},{"id":"BTN_RESTART","label":"Restart Button","value":"PLAY AGAIN","default":"PLAY AGAIN","max_length":15},{"id":"LBL_SCORE","label":"Score Label","value":"FINAL SCORE","default":"FINAL SCORE","max_length":15},{"id":"LBL_GAME_OVER","label":"Game Over Label","value":"GAME OVER","default":"GAME OVER","max_length":15},{"id":"BTN_POST_PLAY","label":"Post Play Button (Not displayed, uses TT locale)","value":"Post My Play","default":"Post My Play","max_length":20}],"images":[{"id":"BG_MAIN","label":"Main Background / Title Image","path":"./assets/bg_main.png","replaceable":true},{"id":"UI_HEART_FULL","label":"Full Heart Icon","path":"./assets/ui_heart_full.webp","replaceable":true},{"id":"UI_HEART_EMPTY","label":"Empty Heart Icon","path":"./assets/ui_heart_empty.webp","replaceable":true},{"id":"FOOD_FRESH_1","label":"Fresh Food 1","path":"./assets/food_apple_fresh.webp","replaceable":true},{"id":"FOOD_SPOIL_1","label":"Spoiled Food 1","path":"./assets/food_apple_spoil.webp","replaceable":true},{"id":"FOOD_FRESH_2","label":"Fresh Food 2","path":"./assets/food_bread_fresh.webp","replaceable":true},{"id":"FOOD_SPOIL_2","label":"Spoiled Food 2","path":"./assets/food_bread_spoil.webp","replaceable":true},{"id":"FOOD_FRESH_3","label":"Fresh Food 3","path":"./assets/food_cheese_fresh.webp","replaceable":true},{"id":"FOOD_SPOIL_3","label":"Spoiled Food 3","path":"./assets/food_cheese_spoil.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  <script>
    (function () {
      if (window.location.protocol !== 'file:') return;
      var configText = document.getElementById('playable-inline-config').textContent;
      var nativeFetch = window.fetch;
      window.fetch = function (input) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (/(^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: function () { return Promise.resolve(JSON.parse(configText)); },
            text: function () { return Promise.resolve(configText); }
          });
        }
        return nativeFetch.apply(window, arguments);
      };
    }());
  </script>
  <!-- playable-inline-config:end -->
  <script src="./bundle.js?v=balanced-items-1"></script>
</body>
</html>
