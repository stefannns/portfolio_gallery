<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>
  <link rel="stylesheet" href="./bundle.css" />
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #050510; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #294650; outline-offset: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- playable-inline-config:start -->
  <script id="playable-inline-config" type="application/json">{"tweaks":[{"id":"INITIAL_TIME","kind":"number","label":"Initial Time Limit (ms)","value":3000,"default":3000,"min":1000,"max":5000,"step":100},{"id":"MIN_TIME","kind":"number","label":"Minimum Time Limit (ms)","value":800,"default":800,"min":300,"max":1500,"step":50},{"id":"TIME_DECREMENT","kind":"number","label":"Time Decrease per Correct (ms)","value":100,"default":100,"min":10,"max":200,"step":10},{"id":"SCORE_PER_CORRECT","kind":"number","label":"Score per Correct Decision","value":10,"default":10,"min":1,"max":100,"step":1}],"texts":[{"id":"GAME_TITLE","label":"Game Title","value":"Fridge Inspector","default":"Fridge Inspector","max_length":20},{"id":"BTN_START","label":"Start Button","value":"START","default":"START","max_length":10},{"id":"BTN_EAT","label":"Eat Button","value":"EAT","default":"EAT","max_length":10},{"id":"BTN_PASS","label":"Pass Button","value":"PASS","default":"PASS","max_length":10},{"id":"BTN_RESTART","label":"Restart Button","value":"PLAY AGAIN","default":"PLAY AGAIN","max_length":15},{"id":"LBL_SCORE","label":"Score Label","value":"FINAL SCORE","default":"FINAL SCORE","max_length":15},{"id":"LBL_GAME_OVER","label":"Game Over Label","value":"GAME OVER","default":"GAME OVER","max_length":15},{"id":"BTN_POST_PLAY","label":"Post Play Button (Not displayed, uses TT locale)","value":"Post My Play","default":"Post My Play","max_length":20}],"images":[{"id":"BG_MAIN","label":"Main Background / Title Image","path":"./assets/fridge-hero-v3.webp","replaceable":true},{"id":"UI_HEART_FULL","label":"Full Heart Icon","path":"./assets/heart-full-v2.svg","replaceable":true},{"id":"UI_HEART_EMPTY","label":"Empty Heart Icon","path":"./assets/heart-empty-v2.svg","replaceable":true},{"id":"FOOD_FRESH_1","label":"Fresh Food 1","path":"./assets/food-apple-fresh-v3.webp","replaceable":true},{"id":"FOOD_SPOIL_1","label":"Spoiled Food 1","path":"./assets/food-apple-spoil-v3.webp","replaceable":true},{"id":"FOOD_FRESH_2","label":"Fresh Food 2","path":"./assets/food-bread-fresh-v3.webp","replaceable":true},{"id":"FOOD_SPOIL_2","label":"Spoiled Food 2","path":"./assets/food-bread-spoil-v3.webp","replaceable":true},{"id":"FOOD_FRESH_3","label":"Fresh Food 3","path":"./assets/food-cheese-fresh-v3.webp","replaceable":true},{"id":"FOOD_SPOIL_3","label":"Spoiled Food 3","path":"./assets/food-cheese-spoil-v3.webp","replaceable":true}],"config_version":"2.0","playable":{"runtime_target":"h5","h5_playstyle_type":"general_game","content_locale":"en","min_capability_level":1,"full_capability_level":1}}</script>
  <script>
    (function () {
      if (window.location.protocol !== 'file:') return;
      var configText = document.getElementById('playable-inline-config').textContent;
      var nativeFetch = window.fetch;
      window.fetch = function (input) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (/(^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve({
            ok: true,
            status: 200,
            json: function () { return Promise.resolve(JSON.parse(configText)); },
            text: function () { return Promise.resolve(configText); }
          });
        }
        return nativeFetch.apply(window, arguments);
      };
    }());
  </script>
  <!-- playable-inline-config:end -->
  <script src="./bundle.js?v=generated-fridge-art-3"></script>
</body>
</html>
