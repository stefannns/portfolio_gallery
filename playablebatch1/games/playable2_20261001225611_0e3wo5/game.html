    body { background: #050510; -webkit-tap-highlight-color: transparent; }

<body>

    },
    {
      "id": "MIN_SPEED",
      "kind": "number",
      "label": "Min Speed",
      "value": 80,
      "default": 80,
      "min": 50,
      "max": 150,
      "step": 10
    }
  ],
  "texts": [
    {
      "id": "GAME_TITLE",
      "label": "Game Title",
      "value": "CATS SNAKE",
      "default": "CATS SNAKE",
      "max_length": 20
    },
    {
      "id": "BTN_START",
      "label": "Start Button",
      "value": "START GAME",

    },
    {
      "id": "BTN_RESTART",

    }
  ],
  "images": [
    {
      "id": "BG_MAIN",
      "label": "Cats Background Image",
      "path": "./assets/bg_main.webp",
      "replaceable": true
    },
    {

      "label": "Snake Cat Head",

    "post_id": "99278216795270197",
    "version_id": "99278216795338640",
    "runtime_target": "h5",
    "h5_playstyle_type": "general_game",
    "content_locale": "en",
    "min_capability_level": 1,
    "full_capability_level": 1
  }
}</script>
  <script>
    // file:// pages cannot fetch their adjacent JSON in Chrome. Keep the normal
    // package fetch path on HTTP, and serve only the local config from this copy.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./meme-snake.js?v=full-width-smaller-cats-20261006-3"></script>
