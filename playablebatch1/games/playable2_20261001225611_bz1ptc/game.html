<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Playable</title>

    body { background: #050510; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>

  <script id="playable-config-inline" type="application/json">{

    },
    {

      "label": "Pass Accuracy (%)",

      "min": 10,
      "max": 100,
      "step": 5
    }
  ],
  "texts": [
    {
      "id": "GAME_TITLE",
      "label": "Game Title",
      "value": "Stayin' Alive CPR",
      "default": "Stayin' Alive CPR",
      "max_length": 30
    },
    {
      "id": "GAME_SUBTITLE",
      "label": "Subtitle",
      "value": "Tap to the beat to save a life!",
      "default": "Tap to the beat to save a life!",
      "max_length": 40
    },
    {
      "id": "INSTRUCTION",

      "value": "Ideally, perform compressions at 100-120 beats per minute",
      "default": "Ideally, perform compressions at 100-120 beats per minute",
      "max_length": 80
    },
    {

    {

    {

  "images": [

  "config_version": "2.0",
  "playable": {
    "post_id": "99278216778511579",
    "version_id": "99278216778645925",
    "runtime_target": "h5",
    "h5_playstyle_type": "general_game",
    "content_locale": "en",
    "min_capability_level": 1,
    "full_capability_level": 1
  }

  <script>
    // file:// pages cannot fetch their adjacent JSON in Chrome. Keep the normal
    // package fetch path on HTTP, and serve only the local config from this copy.
    if (location.protocol === "file:") {
      const config = document.getElementById("playable-config-inline").textContent;
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, options) {
        const url = typeof input === "string" ? input : input && input.url;
        if (url && /(?:^|\/)game\.config\.json(?:[?#]|$)/.test(url)) {
          return Promise.resolve(new Response(config, {
            status: 200,
            headers: { "Content-Type": "application/json" }
          }));
        }
        return originalFetch(input, options);
      };
    }
  </script>
  <script src="./bundle.js"></script>
</body>
</html>
