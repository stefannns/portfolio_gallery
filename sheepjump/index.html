<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Deployed under /sheepjump on Vercel, which serves this file at BOTH /sheepjump and
         /sheepjump/. Without the trailing slash, every relative path (game.js, libs/, assets/)
         resolves against the site root and 404s. This pins the base so they work either way. -->
    <base href="/sheepjump/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheep Runner</title>
    <style>
        @font-face {
            font-family: 'Rubik';
            src: url('libs/fonts/Rubik-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Rubik';
            src: url('libs/fonts/Rubik-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            overflow: hidden;
        }
        /* Responsive stage: fill the embed/iframe while keeping the game's 9:16 portrait
           aspect ratio, so it scales to any Lark embed size instead of a fixed 360x640.
           height = the largest that still fits BOTH the viewport height (100vh) and, via
           the 9:16 ratio, its width (100vw). Whichever dimension is the constraint wins. */
        #stage {
            position: relative;
            aspect-ratio: 9 / 16;
            height: min(100vh, 100vw * 16 / 9);
            max-width: 100vw;
        }
        #cam {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #555;
            /* front camera reads as a mirror, which is what users expect */
            transform: scaleX(-1);
        }
        canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <div id="stage">
        <!-- The game canvas is transparent above the hills; the live webcam sits BEHIND it
             so it shows through, mimicking the effect pack's camera feed. -->
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="gameCanvas" width="1080" height="1920"></canvas>
    </div>
    <script src="./tempsdk.js"></script>
    <script src="libs/js-yaml.js"></script>
    <script src="libs/phaser.js"></script>
    <script>
        // webcam preview (on the effect pack the runtime provides the real camera behind
        // the canvas; on web we approximate it with getUserMedia). Needs HTTPS + permission.
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(function (s) { document.getElementById('cam').srcObject = s; })
                .catch(function () { /* denied/unavailable: grey fallback stays */ });
        }
        var boot = function () {
            var s = document.createElement('script');
            s.src = 'game.js';
            document.body.appendChild(s);
        };
        // Boot no matter what: if the Rubik .ttf fails to load, document.fonts.load REJECTS,
        // and a bare .then(boot) would leave the page permanently blank. Race the font load
        // against a 5s failsafe, and boot on both fulfil and reject.
        Promise.race([
            Promise.all([
                document.fonts.load("normal 16px 'Rubik'"),
                document.fonts.load("bold 16px 'Rubik'"),
            ]),
            new Promise(function (r) { setTimeout(r, 5000); })
        ]).then(boot, boot);
    </script>
</body>
</html>
